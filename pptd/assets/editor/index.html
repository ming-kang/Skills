<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      Offline enforcement. The fetch/XHR shim below cannot see a <script>, a CSS
      @font-face or a sendBeacon, so on its own it would let a telemetry SDK or
      a remote @font-face through. This policy blocks every origin but our own
      host, whatever initiates it.
      `data:` is required in script-src: the bundle's module loader probes
      `import.meta.resolve` through a data: script, and without it the app never
      mounts (silent blank page). `unsafe-eval` is required to compile the WASM.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <title>PPT Design</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
      /* Avoid dark FOUC before Vue theme init (bundle default is system → OS dark). */
      html, body { background: #ffffff; color-scheme: light; }
    </style>
    <script>
      // Earliest possible error capture, for the bridge's handshake watchdog.
      // This has to be an inline script in <head>: a CSP violation against the
      // editor bundle fires while the module scripts below are still being
      // fetched, which is before local-bridge.js gets to run. Without this the
      // watchdog can only report "the editor never connected" with no reason.
      (function () {
        var errors = (window.__ND_ERRORS__ = []);
        function record(kind, detail) {
          if (errors.length < 20) errors.push(kind + ": " + detail);
        }
        document.addEventListener("securitypolicyviolation", function (event) {
          record("CSP", (event.violatedDirective || "") + " blocked " + (event.blockedURI || ""));
        });
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && (target.src || target.href)) record("load failed", target.src || target.href);
            else record("error", (event.message || "") + " @ " + (event.filename || ""));
          },
          true, // capture: resource load errors do not bubble
        );
        window.addEventListener("unhandledrejection", function (event) {
          record("unhandled rejection", String(event.reason && event.reason.message ? event.reason.message : event.reason));
        });
      })();
    </script>
    <!-- Editor bundle (local build) -->
    <script type="module" crossorigin src="./app/polyfills-CXLN5T9E.js"></script>
    <script>
      (function () {
        // The editor defaults theme to "system" and may flip to dark on mount.
        // Lock light mode before the Vue bundle runs.
        try {
          localStorage.setItem("CUSTOM_THEME", JSON.stringify("light"));
        } catch (_) {}
        window.INJECT_ENV = Object.assign({}, window.INJECT_ENV, { theme: "light" });
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        // Completely offline: answer the bundle's legacy cloud endpoints locally
        // so no request ever leaves the machine.
        const blocked = [
          /\/apiv2\//,
          /www\.kimi\.com/,
          /kimi\.ai/,
          /slides\.kimi\./,
          /gator\.volces\.com/,
          /volces\.com/,
          /byteimg\.com\/obj\/.*log/,
          /\/list$/,
          /accounts\.google\.com/,
          /googleapis\.com/,
          /docs\.google\.com/,
        ];
        const nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          const url = typeof input === "string" ? input : input && input.url;
          if (url && blocked.some((re) => re.test(String(url)))) {
            return Promise.resolve(
              new Response(JSON.stringify({ signature: "offline-bypass", algorithm: "Ed25519", offline: true }), {
                status: 200,
                headers: { "Content-Type": "application/json" },
              }),
            );
          }
          return nativeFetch(input, init);
        };
        const XO = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          this.__ndUrl = url;
          return XO.apply(this, arguments);
        };
        const XS = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function () {
          if (this.__ndUrl && blocked.some((re) => re.test(String(this.__ndUrl)))) {
            Object.defineProperty(this, "status", { value: 200 });
            Object.defineProperty(this, "responseText", { value: '{"offline":true}' });
            this.onload && this.onload();
            return;
          }
          return XS.apply(this, arguments);
        };
      })();
    </script>
    <!-- Local bridge MUST load before the editor bundle (defines __NEODECK_CONNECT__) -->
    <script type="module" src="./local-bridge.js"></script>
    <script type="module" crossorigin src="./app/index-jtNAhQeK.js"></script>
    <link rel="modulepreload" crossorigin href="./app/rolldown-runtime-DWdDZTNf.js" />
    <link rel="modulepreload" crossorigin href="./app/vue-B11_pI9F.js" />
    <link rel="modulepreload" crossorigin href="./app/common-utils-G6HD4Ji1.js" />
    <link rel="modulepreload" crossorigin href="./app/_plugin-vue_export-helper-B67ILkmu.js" />
    <link rel="modulepreload" crossorigin href="./app/preload-helper-NECkhNH4.js" />
    <link rel="modulepreload" crossorigin href="./app/kimi-DRwOD7EI.js" />
    <link rel="modulepreload" crossorigin href="./app/icons-CgDhqj4h.js" />
    <link rel="modulepreload" crossorigin href="./app/const-BjfH-jZe.js" />
    <link rel="stylesheet" crossorigin href="./app/index-Bn1xM_xZ.css" />
    <link rel="stylesheet" href="./local-shell.css" />
  
    <style id="neodeck-layout-fix">
      /* editor-app height fix: avoid 100vh under local topbar */
      .editor-app[data-v-ddddc63d] { height: 100% !important; width: 100% !important; }
      .editor-app .editor-content[data-v-ddddc63d] { height: calc(100% - var(--topbar-height, 52px)) !important; }
      .feedback-snackbar-wrap[data-v-ddddc63d] { z-index: 20000 !important; }
    </style>
</head>
  <body class="neodeck-local">
    <header class="nd-topbar" id="nd-topbar">
      <div class="nd-brand"><strong>PPT Design</strong></div>
      <div class="nd-actions">
        <button type="button" class="nd-btn nd-btn-primary" id="nd-open">打开项目文件夹</button>
      </div>
      <div class="nd-meta">
        <span id="nd-title">未打开文稿</span>
        <span id="nd-status" class="nd-status">初始化中</span>
      </div>
      <input type="file" id="nd-folder" webkitdirectory directory multiple hidden />
    </header>
    <div id="app"></div>
    <div id="nd-toast" class="nd-toast" hidden></div>
  </body>
</html>
