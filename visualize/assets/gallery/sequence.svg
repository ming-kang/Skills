<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 518" width="900" height="518" role="img">
  <title>OAuth2 authorization code flow</title>
  <desc>The client redirects the user to the auth server, exchanges the code for a token, then calls the resource server.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="518" fill="#FFFFFF"/>
  <line x1="140" y1="80" x2="140" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="340" y1="80" x2="340" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="560" y1="80" x2="560" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="780" y1="80" x2="780" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="140" y1="130" x2="560" y2="130" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="560" y1="180" x2="140" y2="180" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="140" y1="230" x2="340" y2="230" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="340" y1="280" x2="560" y2="280" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="560" y1="330" x2="340" y2="330" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="340" y1="380" x2="780" y2="380" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="780" y1="420" x2="340" y2="420" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="80" y="40" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="280" y="40" width="120" height="40" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="500" y="40" width="120" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="720" y="40" width="120" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="140" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">User</text>
  <text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text x="560" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Auth server</text>
  <text x="780" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Resource</text>
  <text x="350" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">authorize</text>
  <text x="350" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">login + consent</text>
  <text x="240" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">auth code</text>
  <text x="450" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">exchange</text>
  <text x="450" y="322" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">token</text>
  <text x="560" y="372" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">API call</text>
  <text x="560" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">resource</text>
  <rect x="40" y="462" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="468" dominant-baseline="central" font-size="12" fill="#3D3D3A">user / token</text>
  <rect x="164" y="462" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="182" y="468" dominant-baseline="central" font-size="12" fill="#3D3D3A">auth</text>
  <rect x="234" y="462" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="252" y="468" dominant-baseline="central" font-size="12" fill="#3D3D3A">resource</text>
</svg>
