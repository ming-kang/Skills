<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 644" width="800" height="644" role="img">
  <title>Authentication fragments</title>
  <desc>A login request receives a token or rejection in an alt fragment. An opt fragment calls the API only with a valid token and permission.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="800" height="644" fill="#FFFFFF"/>
  <line x1="240" y1="136" x2="240" y2="548" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="460" y1="136" x2="460" y2="548" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="680" y1="136" x2="680" y2="548" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <rect data-role="container" x="40" y="212" width="720" height="152" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text data-role="container-label" x="62" y="238" dominant-baseline="central" font-size="14" font-weight="500" letter-spacing="2" fill="#141413">ALT</text>
<line x1="40" y1="284" x2="760" y2="284" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <rect data-role="container" x="40" y="400" width="720" height="132" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text data-role="container-label" x="62" y="426" dominant-baseline="central" font-size="14" font-weight="500" letter-spacing="2" fill="#141413">OPT</text>
  <text data-role="container-label" x="62" y="446" dominant-baseline="central" font-size="12" fill="#3D3D3A">token valid + permitted</text>
  <line data-role="connector" x1="246" y1="172" x2="454" y2="172" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="454" y1="256" x2="246" y2="256" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="454" y1="328" x2="246" y2="328" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="246" y1="448" x2="674" y2="448" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="674" y1="500" x2="246" y2="500" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="329" y="152" width="42" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="329" y="236" width="42" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="325" y="308" width="49" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="432" y="428" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <rect x="429" y="480" width="63" height="16" rx="3" fill="#FFFFFF"/>
  <rect data-role="node" x="168" y="96" width="144" height="40" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="388" y="96" width="144" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect data-role="node" x="608" y="96" width="144" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect data-role="activation" x="234.0" y="164" width="12" height="352" rx="4" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect data-role="activation" x="454.0" y="172" width="12" height="168" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect data-role="activation" x="674.0" y="440" width="12" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="240" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text data-role="node-text" x="460" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Auth service</text>
  <text data-role="node-text" x="680" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">API</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Authentication fragments</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Alternative outcomes and an optional API call</text>
<text data-role="container-label" x="62" y="260" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">[valid]</text>
<text data-role="container-label" x="62" y="320" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">[invalid]</text>
  <text data-role="arrow-label" x="350" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">login</text>
  <text data-role="arrow-label" x="350" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">token</text>
  <text data-role="arrow-label" x="350" y="316" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">denied</text>
  <text data-role="arrow-label" x="460" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">request</text>
  <text data-role="arrow-label" x="460" y="488" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">response</text>
<line x1="40" y1="580" x2="760" y2="580" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="598" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="604" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Authentication</text>
<rect x="178" y="598" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="196" y="604" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Authorized call</text>
<rect x="323" y="598" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text data-role="legend-label" x="341" y="604" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Rejected</text>
<line x1="420" y1="604" x2="450" y2="604" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text data-role="legend-label" x="462" y="604" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Request</text>
<line x1="534" y1="604" x2="564" y2="604" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text data-role="legend-label" x="576" y="604" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Return</text>
</svg>
