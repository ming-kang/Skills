<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img">
  <title>Sequence with frames</title>
  <desc>Three lifelines with alt/opt frames and activation boxes.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#FFFFFF"/>
  <line x1="180" y1="120" x2="180" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="444" y1="120" x2="444" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="680" y1="120" x2="680" y2="440" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <rect data-role="container" x="50" y="120" width="660" height="140" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text data-role="container-label" x="72" y="146" dominant-baseline="central" font-size="14" font-weight="500" letter-spacing="2" fill="#141413">ALT</text>
  <text data-role="container-label" x="72" y="166" dominant-baseline="central" font-size="12" fill="#3D3D3A">authenticated</text>
  <rect data-role="container" x="50" y="280" width="660" height="100" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="6 4"/>
  <text data-role="container-label" x="72" y="306" dominant-baseline="central" font-size="14" font-weight="500" letter-spacing="2" fill="#141413">OPT</text>
  <text data-role="container-label" x="72" y="326" dominant-baseline="central" font-size="12" fill="#3D3D3A">has permission</text>
  <line x1="180" y1="150" x2="444" y2="150" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="444" y1="200" x2="180" y2="200" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="50" y1="215" x2="710" y2="215" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="310" x2="680" y2="310" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="680" y1="350" x2="180" y2="350" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="120" y="80" width="120" height="40" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="380" y="80" width="128" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="620" y="80" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="174.0" y="120" width="12" height="240" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="438.0" y="140" width="12" height="100" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="674.0" y="300" width="12" height="60" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text data-role="node-text" x="444" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Auth Service</text>
  <text data-role="node-text" x="680" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">API</text>
  <text data-role="arrow-label" x="312" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">login</text>
  <text data-role="arrow-label" x="312" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">token</text>
<text data-role="arrow-label" x="70" y="232" font-size="12" font-style="italic" dominant-baseline="central" fill="#3D3D3A">[else] reject</text>
  <text data-role="arrow-label" x="430" y="302" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">request</text>
  <text data-role="arrow-label" x="430" y="342" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">response</text>
  <rect x="40" y="454" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text data-role="legend-label" x="58" y="460" dominant-baseline="central" font-size="12" fill="#3D3D3A">authentication</text>
  <rect x="178" y="454" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="legend-label" x="196" y="460" dominant-baseline="central" font-size="12" fill="#3D3D3A">authorized call</text>
</svg>
