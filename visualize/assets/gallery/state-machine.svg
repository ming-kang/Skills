<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img">
  <title>Order fulfillment state machine</title>
  <desc>An order moves from idle through processing; timeout routes to error, else done.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="412" fill="#FFFFFF"/>
  <line x1="58" y1="80" x2="120" y2="80" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="264" y1="80" x2="340" y2="80" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="476" y1="80" x2="500" y2="80" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M550 120 L550 150 L460 150 L460 200" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M550 120 L550 150 L648 150 L648 200" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="460" y1="256" x2="460" y2="310" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="468" y="275" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <circle cx="50" cy="80" r="8" fill="#141413"/>
  <rect x="120" y="52" width="144" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="340" y="52" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <polygon points="550,40 600,80 550,120 500,80" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="400" y="200" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="580" y="200" width="136" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <circle cx="460" cy="322" r="12" fill="none" stroke="#141413" stroke-width="1.5"/>
  <circle cx="460" cy="322" r="8" fill="#141413"/>
  <text x="192" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Idle</text>
  <text x="192" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">awaiting payment</text>
  <text x="408" y="72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Processing</text>
  <text x="408" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">payment cleared</text>
  <text x="550" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">timeout?</text>
  <text x="460" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Done</text>
  <text x="460" y="237" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">shipped</text>
  <text x="648" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Error</text>
  <text x="648" y="237" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">payment timeout</text>
  <text x="89" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">create</text>
  <text x="302" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">pay</text>
  <text x="505" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">no</text>
  <text x="599" y="142" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">yes</text>
  <text x="468" y="283" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">deliver</text>
  <rect x="40" y="356" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="362" dominant-baseline="central" font-size="12" fill="#3D3D3A">happy path</text>
  <rect x="151" y="356" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="169" y="362" dominant-baseline="central" font-size="12" fill="#3D3D3A">failure</text>
</svg>
