<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 608" width="640" height="608" role="img">
  <title>Pull request workflow</title>
  <desc>Open a pull request, review it, and deploy after tests pass. Failed checks return through a fixes branch.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="640" height="608" fill="#FFFFFF"/>
  <line data-role="connector" x1="224" y1="152" x2="224" y2="208" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="224" y1="264" x2="224" y2="320" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="224" y1="408" x2="224" y2="464" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="320" y1="364" x2="424" y2="364" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path data-role="connector" d="M512 336 L512 236 L320 236" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect data-role="node" x="128" y="96" width="192" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="128" y="208" width="192" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <polygon data-role="node" points="224,320 320,364 224,408 128,364" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect data-role="node" x="128" y="464" width="192" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="424" y="336" width="176" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text data-role="node-text" x="224" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Open PR</text>
  <text data-role="node-text" x="224" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">diff ready</text>
  <text data-role="node-text" x="224" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Code review</text>
  <text data-role="node-text" x="224" y="245" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">human + lint</text>
  <text data-role="node-text" x="224" y="364" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Tests pass?</text>
  <text data-role="node-text" x="224" y="484" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Deploy</text>
  <text data-role="node-text" x="224" y="501" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ship to production</text>
  <text data-role="node-text" x="512" y="356" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Fix issues</text>
  <text data-role="node-text" x="512" y="373" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">amend diff</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Pull request workflow</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Review, validate, and deploy</text>
  <text data-role="arrow-label" x="236" y="436" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">yes</text>
  <text data-role="arrow-label" x="372" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">no</text>
  <text data-role="arrow-label" x="416" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">review again</text>
<line x1="40" y1="544" x2="600" y2="544" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="562" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="568" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Review</text>
<rect x="123" y="562" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text data-role="legend-label" x="141" y="568" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Decision</text>
<rect x="220" y="562" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="238" y="568" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Passed</text>
<rect x="303" y="562" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text data-role="legend-label" x="321" y="568" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Rework</text>
</svg>
