<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img">
  <title>Pre-deploy quality gate</title>
  <desc>A change passes review and tests; a failing test routes back to fixes, a passing one proceeds to deploy.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="560" fill="#FFFFFF"/>
  <line x1="360" y1="96" x2="360" y2="140" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M360 196 L360 218 L320 218 L320 240" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="289" x2="540" y2="289" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M600 260 L600 212 L460 212 L460 168 L420 168" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M320 340 L320 380 L360 380 L360 420" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="300" y="40" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="300" y="140" width="120" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <polygon points="320,240 380,290 320,340 260,290" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="540" y="260" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <rect x="300" y="420" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="360" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Open PR</text>
  <text x="360" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">diff ready</text>
  <text x="360" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Code review</text>
  <text x="360" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">human + lint</text>
  <text x="320" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Tests pass?</text>
  <text x="600" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Fix issues</text>
  <text x="600" y="297" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">amend diff</text>
  <text x="360" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Deploy</text>
  <text x="360" y="457" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ship to prod</text>
  <text x="460" y="281" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">no</text>
  <text x="328" y="360" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">yes</text>
  <rect x="40" y="498" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="504" dominant-baseline="central" font-size="12" fill="#3D3D3A">pass path</text>
  <rect x="144" y="498" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="162" y="504" dominant-baseline="central" font-size="12" fill="#3D3D3A">decision</text>
  <rect x="241" y="498" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="259" y="504" dominant-baseline="central" font-size="12" fill="#3D3D3A">fail / retry</text>
</svg>
