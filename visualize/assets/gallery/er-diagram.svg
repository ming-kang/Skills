<rect x="137" y="394" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="155" y="400" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Entity</text>
<rect x="220" y="394" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text data-role="legend-label" x="238" y="400" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Relationship</text>
</svg>
