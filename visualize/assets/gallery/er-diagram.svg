<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img">
  <title>E-commerce ER schema</title>
  <desc>Users place orders; each order contains products.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <path d="M120 150 L120 185 L270 185 L270 220" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M270 220 L270 185 L400 185 L400 150" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M400 150 L400 185 L530 185 L530 220" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M530 220 L530 185 L680 185 L680 150" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="40" y="60" width="160" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <line x1="40" y1="88" x2="200" y2="88" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="320" y="60" width="160" height="90" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="320" y1="88" x2="480" y2="88" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="600" y="60" width="160" height="90" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="600" y1="88" x2="760" y2="88" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <polygon points="270,220 320,256 270,292 220,256" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <polygon points="530,220 580,256 530,292 480,256" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="120" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">User</text>
  <text x="52" y="102" dominant-baseline="central" font-size="12" fill="#0F6E56">id (PK)</text>
  <text x="52" y="120" dominant-baseline="central" font-size="12" fill="#0F6E56">email</text>
  <text x="52" y="138" dominant-baseline="central" font-size="12" fill="#0F6E56">name</text>
  <text x="400" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Order</text>
  <text x="332" y="102" dominant-baseline="central" font-size="12" fill="#3D3D3A">id (PK)</text>
  <text x="332" y="120" dominant-baseline="central" font-size="12" fill="#3D3D3A">user_id (FK)</text>
  <text x="332" y="138" dominant-baseline="central" font-size="12" fill="#3D3D3A">total</text>
  <text x="680" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Product</text>
  <text x="612" y="102" dominant-baseline="central" font-size="12" fill="#3D3D3A">id (PK)</text>
  <text x="612" y="120" dominant-baseline="central" font-size="12" fill="#3D3D3A">sku</text>
  <text x="612" y="138" dominant-baseline="central" font-size="12" fill="#3D3D3A">price</text>
  <text x="270" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">places</text>
  <text x="530" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">contains</text>
<text x="175" y="170" dominant-baseline="central" font-size="12" fill="#3D3D3A">1</text>
<text x="275" y="170" dominant-baseline="central" font-size="12" fill="#3D3D3A">N</text>
<text x="420" y="170" dominant-baseline="central" font-size="12" fill="#3D3D3A">1</text>
<text x="545" y="170" dominant-baseline="central" font-size="12" fill="#3D3D3A">N</text>
  <rect x="40" y="314" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="320" dominant-baseline="central" font-size="12" fill="#3D3D3A">primary entity</text>
  <rect x="178" y="314" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="196" y="320" dominant-baseline="central" font-size="12" fill="#3D3D3A">relationship</text>
</svg>
