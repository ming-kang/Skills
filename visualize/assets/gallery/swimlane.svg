<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" role="img">
  <title>Order fulfillment swimlanes</title>
  <desc>A purchase flows across three role lanes — Customer, Store, Warehouse — with the handoffs crossing lane boundaries and a terracotta out-of-stock return path.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="508" fill="#FFFFFF"/>
  <rect x="40" y="60" width="820" height="110" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="60" y="86" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Customer</text>
  <rect x="40" y="190" width="820" height="110" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="60" y="216" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Store</text>
  <rect x="40" y="320" width="820" height="110" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="60" y="346" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Warehouse</text>
  <path d="M242 144 L242 181 L256 181 L256 218" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M332 246 L381 246 L381 376 L430 376" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="550" y1="376" x2="640" y2="376" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="710" y1="348" x2="710" y2="144" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="492" y1="348" x2="492" y2="274" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M430 246 L367 246 L367 116 L304 116" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="180" y="88" width="124" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="180" y="218" width="152" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="430" y="348" width="120" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="640" y="348" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="640" y="88" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="430" y="218" width="128" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="242" y="108" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Place order</text>
  <text x="242" y="125" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">cart checkout</text>
  <text x="256" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Confirm payment</text>
  <text x="256" y="255" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">charge card</text>
  <text x="490" y="368" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Pick items</text>
  <text x="490" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">from shelf</text>
  <text x="708" y="368" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Pack + ship</text>
  <text x="708" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">carrier handoff</text>
  <text x="712" y="108" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Track shipment</text>
  <text x="712" y="125" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">email + status</text>
  <text x="494" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Out of stock</text>
  <text x="494" y="255" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">refund path</text>
  <text x="250" y="162" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">pay</text>
  <text x="389" y="311" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">pick list</text>
  <text x="718" y="246" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">tracking</text>
  <text x="500" y="311" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">missing</text>
  <text x="375" y="181" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">refund</text>
  <rect x="40" y="452" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="458" dominant-baseline="central" font-size="12" fill="#3D3D3A">happy path</text>
  <rect x="151" y="452" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text x="169" y="458" dominant-baseline="central" font-size="12" fill="#3D3D3A">internal step</text>
  <rect x="282" y="452" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="300" y="458" dominant-baseline="central" font-size="12" fill="#3D3D3A">out of stock</text>
</svg>
