  <text x="400" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Perception</text>
  <text x="665" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Memory</text>
  <text x="665" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Reasoning</text>
  <text x="175" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Action</text>
  <text x="175" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Learning</text>
