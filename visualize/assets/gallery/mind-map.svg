<rect x="144" y="474" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="162" y="480" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Capabilities</text>
</svg>
