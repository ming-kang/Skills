      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#FFFFFF"/>
  <path d="M 400 180 C 400 180 400 80 400 80" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 475 208 C 532 208 532 120 590 120" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
