<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img">
  <title>AI agent capabilities</title>
  <desc>Perception, learning, memory, action, and reasoning branch from one core agent loop.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="520" fill="#FFFFFF"/>
  <path d="M 380 260 C 380 260 380 148 380 148" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 280 288 C 240 288 240 232 200 232" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 280 288 C 240 288 240 392 200 392" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 480 288 C 520 288 520 232 560 232" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 480 288 C 520 288 520 392 560 392" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="280" y="260" width="200" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="300" y="108" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="40" y="204" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="40" y="364" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="560" y="204" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="560" y="364" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="380" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">AI agent</text>
  <text data-role="node-text" x="380" y="297" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">core loop</text>
  <text data-role="node-text" x="380" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Perception</text>
  <text data-role="node-text" x="120" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Learning</text>
  <text data-role="node-text" x="120" y="241" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">adapt from feedback</text>
  <text data-role="node-text" x="120" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Action</text>
  <text data-role="node-text" x="120" y="401" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">interact with tools</text>
  <text data-role="node-text" x="640" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Memory</text>
  <text data-role="node-text" x="640" y="241" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">recall prior context</text>
  <text data-role="node-text" x="640" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Reasoning</text>
  <text data-role="node-text" x="640" y="401" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">plan the next step</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">AI agent capabilities</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Five capabilities organized around one core loop</text>
