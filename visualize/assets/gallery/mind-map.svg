  <rect x="590" y="100" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="590" y="260" width="150" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="100" y="260" width="150" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
