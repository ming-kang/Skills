<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" width="1000" height="528" role="img">
  <title>Memory read and write paths</title>
  <desc>The manager writes extracted memories to vector and graph stores. A separate query drives retrieval and ranking of both stores into context.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="1000" height="528" fill="#FFFFFF"/>
  <line data-role="connector" x1="176" y1="256" x2="240" y2="256" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path data-role="connector" d="M432 256 L472 256" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path data-role="connector" d="M472 148 L472 364" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-role="connector" x1="472" y1="148" x2="512" y2="148" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path data-role="connector" d="M696 148 L752 148" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-role="connector" x1="472" y1="364" x2="512" y2="364" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path data-role="connector" d="M696 364 L752 364" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path data-role="connector" d="M752 148 L752 364" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-role="connector" x1="752" y1="256" x2="800" y2="256" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="880" y1="152" x2="880" y2="228" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="880" y1="284" x2="880" y2="384" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect data-role="node" x="40" y="228" width="136" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="240" y="228" width="192" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <path data-role="node" d="M 512 121 A 92 9 0 0 1 696 121 L 696 175 A 92 9 0 0 1 512 175 Z" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <ellipse data-role="node-part" cx="604" cy="121" rx="92" ry="9" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <path data-role="node" d="M 512 337 A 92 9 0 0 1 696 337 L 696 391 A 92 9 0 0 1 512 391 Z" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <ellipse data-role="node-part" cx="604" cy="337" rx="92" ry="9" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="800" y="96" width="160" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="800" y="228" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="800" y="384" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="108" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Input</text>
  <text data-role="node-text" x="108" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">new message</text>
  <text data-role="node-text" x="336" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Memory manager</text>
  <text data-role="node-text" x="336" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">extract + route</text>
  <text data-role="node-text" x="604" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Vector store</text>
  <text data-role="node-text" x="604" y="157" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">embeddings</text>
  <text data-role="node-text" x="604" y="356" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Graph store</text>
  <text data-role="node-text" x="604" y="373" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">relations</text>
  <text data-role="node-text" x="880" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Query</text>
  <text data-role="node-text" x="880" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">current question</text>
  <text data-role="node-text" x="880" y="248" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Retrieve + rank</text>
  <text data-role="node-text" x="880" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">top-k + score</text>
  <text data-role="node-text" x="880" y="404" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Context</text>
  <text data-role="node-text" x="880" y="421" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">for the next turn</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Memory read and write paths</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Persist new information, then retrieve context for the next turn</text>
  <text data-role="arrow-label" x="208" y="244" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">write</text>
  <text data-role="arrow-label" x="892" y="190" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">lookup</text>
  <text data-role="arrow-label" x="892" y="334" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">top-k</text>
<line x1="40" y1="464" x2="960" y2="464" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="482" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="488" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Input / storage</text>
<rect x="185" y="482" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text data-role="legend-label" x="203" y="488" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Write path</text>
<rect x="295" y="482" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="313" y="488" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Read path</text>
</svg>
