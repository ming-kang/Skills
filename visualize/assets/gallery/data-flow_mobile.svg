<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 614" width="360" height="614" role="img">
  <title>Streaming data pipeline (mobile)</title>
  <desc>Vertical re-layout of the data-flow gallery diagram for narrow viewports.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="360" height="614" fill="#FFFFFF"/>
  <line x1="180" y1="96" x2="180" y2="160" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="180" y1="216" x2="180" y2="280" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="180" y1="352" x2="180" y2="420" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="80" y="40" width="200" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="80" y="160" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <path d="M 80 289 A 100 9 0 0 1 280 289 L 280 343 A 100 9 0 0 1 80 343 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="180" cy="289" rx="100" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="80" y="420" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="180" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Kafka</text>
  <text x="180" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">event stream</text>
  <text x="180" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Spark</text>
  <text x="180" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">transform</text>
  <text x="180" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">S3</text>
  <text x="180" y="325" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">parquet</text>
  <text x="180" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Athena</text>
  <text x="180" y="457" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">SQL query</text>
  <text x="188" y="128" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">stream</text>
  <text x="188" y="248" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">batch</text>
  <text x="188" y="386" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">query</text>
  <rect x="40" y="498" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="504" dominant-baseline="central" font-size="12" fill="#3D3D3A">write path</text>
  <rect x="151" y="498" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="169" y="504" dominant-baseline="central" font-size="12" fill="#3D3D3A">read path</text>
  <rect x="40" y="522" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text x="58" y="528" dominant-baseline="central" font-size="12" fill="#3D3D3A">ingest</text>
</svg>
