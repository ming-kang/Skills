<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" width="860" height="424" role="img">
  <title>Platform team org chart</title>
  <desc>A three-level hierarchy: a CTO over two group leads, each over two teams, drawn with vertical fanout buses.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="424" fill="#FFFFFF"/>
  <line x1="430" y1="96" x2="430" y2="120" stroke="#73726C" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M430 120 L240 120 L240 160" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M430 120 L624 120 L624 160" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="240" y1="216" x2="240" y2="240" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M240 240 L124 240 L124 290" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M240 240 L360 240 L360 290" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="624" y1="216" x2="624" y2="240" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M624 240 L520 240 L520 290" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M624 240 L720 240 L720 290" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="370" y="40" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="180" y="160" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="560" y="160" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="60" y="290" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" fill-opacity="0.55"/>
  <rect x="300" y="290" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" fill-opacity="0.55"/>
  <rect x="460" y="290" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" fill-opacity="0.55"/>
  <rect x="660" y="290" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" fill-opacity="0.55"/>
  <text x="430" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">CTO</text>
  <text x="430" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">platform org</text>
  <text x="240" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Infra lead</text>
  <text x="240" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">group of 2</text>
  <text x="624" y="180" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Product lead</text>
  <text x="624" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">group of 2</text>
  <text x="124" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Core systems</text>
  <text x="124" y="327" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">5 engineers</text>
  <text x="360" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">SRE</text>
  <text x="360" y="327" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">4 engineers</text>
  <text x="520" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Web app</text>
  <text x="520" y="327" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">6 engineers</text>
  <text x="720" y="310" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Mobile</text>
  <text x="720" y="327" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">4 engineers</text>
  <rect x="40" y="368" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="58" y="374" dominant-baseline="central" font-size="12" fill="#3D3D3A">leadership</text>
  <rect x="151" y="368" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="169" y="374" dominant-baseline="central" font-size="12" fill="#3D3D3A">infra group</text>
  <rect x="268" y="368" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="286" y="374" dominant-baseline="central" font-size="12" fill="#3D3D3A">product group</text>
</svg>
