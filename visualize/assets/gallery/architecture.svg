<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img">
  <title>Microservice architecture</title>
  <desc>A gateway routes to three services; users and orders share PostgreSQL, while billing uses Redis.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#FFFFFF"/>
  <rect data-role="container" x="40" y="288" width="680" height="136" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text data-role="container-label" x="60" y="314" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Services</text>
  <line x1="380" y1="152" x2="380" y2="208" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M380 264 L380 316" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M152 316 L608 316" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="152" y1="316" x2="152" y2="340" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="316" x2="380" y2="340" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="608" y1="316" x2="608" y2="340" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M152 396 L152 448" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M380 396 L380 448" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M152 448 L380 448" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="266" y1="448" x2="266" y2="480" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="608" y1="396" x2="608" y2="480" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="292" y="96" width="176" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="292" y="208" width="176" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="64" y="340" width="176" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="292" y="340" width="176" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="520" y="340" width="176" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <path d="M 162 489 A 104 9 0 0 1 370 489 L 370 537 A 104 9 0 0 1 162 537 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="266" cy="489" rx="104" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <path d="M 504 489 A 104 9 0 0 1 712 489 L 712 537 A 104 9 0 0 1 504 537 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="608" cy="489" rx="104" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="380" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text data-role="node-text" x="380" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">web + mobile</text>
  <text data-role="node-text" x="380" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">API gateway</text>
  <text data-role="node-text" x="380" y="245" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">routing + auth</text>
  <text data-role="node-text" x="152" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">User service</text>
  <text data-role="node-text" x="152" y="377" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">accounts</text>
  <text data-role="node-text" x="380" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Order service</text>
  <text data-role="node-text" x="380" y="377" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">checkout</text>
  <text data-role="node-text" x="608" y="360" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Payment service</text>
  <text data-role="node-text" x="608" y="377" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">billing</text>
  <text data-role="node-text" x="266" y="505" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">PostgreSQL</text>
  <text data-role="node-text" x="266" y="522" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">orders + users</text>
  <text data-role="node-text" x="608" y="505" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Redis</text>
  <text data-role="node-text" x="608" y="522" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">session cache</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Microservice architecture</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Request routing and shared persistence</text>
  <text data-role="arrow-label" x="392" y="180" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">HTTPS</text>
  <text data-role="arrow-label" x="620" y="438" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">cache</text>
<line x1="40" y1="576" x2="720" y2="576" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="594" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Application</text>
<rect x="157" y="594" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="175" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Persistence</text>
<rect x="275" y="594" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text data-role="legend-label" x="293" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Billing</text>
</svg>
