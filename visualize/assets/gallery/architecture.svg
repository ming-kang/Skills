<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img">
  <title>Microservice architecture</title>
  <desc>Client traffic enters through an API gateway, fans out to three services, which persist to a relational store and a cache.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/>
  <rect x="40" y="250" width="680" height="100" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="60" y="276" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Services</text>
  <line x1="377" y1="96" x2="377" y2="140" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="374" y1="196" x2="374" y2="226" stroke="#73726C" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M374 226 L134 226 L134 280" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M374 226 L358 226 L358 280" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M374 226 L596 226 L596 280" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M134 336 L134 380 L234 380 L234 410" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M358 336 L358 380 L234 380" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M596 336 L596 380 L482 380 L482 410" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="320" y="40" width="120" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="310" y="140" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="70" y="280" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="290" y="280" width="136" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="520" y="280" width="152" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <path d="M 170 419 A 64 9 0 0 1 298 419 L 298 473 A 64 9 0 0 1 170 473 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <ellipse cx="234" cy="419" rx="64" ry="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <path d="M 420 419 A 62 9 0 0 1 544 419 L 544 473 A 62 9 0 0 1 420 473 Z" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <ellipse cx="482" cy="419" rx="62" ry="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="380" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text x="380" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">web + mobile</text>
  <text x="374" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">API gateway</text>
  <text x="374" y="177" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">routing + auth</text>
  <text x="134" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">User service</text>
  <text x="134" y="317" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">accounts</text>
  <text x="358" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Order service</text>
  <text x="358" y="317" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">checkout</text>
  <text x="596" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Payment service</text>
  <text x="596" y="317" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">billing</text>
  <text x="234" y="438" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">PostgreSQL</text>
  <text x="234" y="455" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">orders + users</text>
  <text x="482" y="438" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Redis</text>
  <text x="482" y="455" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">session cache</text>
  <rect x="40" y="504" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="58" y="510" dominant-baseline="central" font-size="12" fill="#3D3D3A">services</text>
  <rect x="137" y="504" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="155" y="510" dominant-baseline="central" font-size="12" fill="#3D3D3A">payment</text>
  <rect x="227" y="504" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="245" y="510" dominant-baseline="central" font-size="12" fill="#3D3D3A">stores</text>
</svg>
