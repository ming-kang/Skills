<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 924" width="1360" height="924" role="img">
  <title>Agent loop · turn 7 of N</title>
  <desc>Intake builds context, the model selects tools, and outputs are verified. Failed verification loops back; successful results become the response. Memory is a separate read/write rail.</desc>
