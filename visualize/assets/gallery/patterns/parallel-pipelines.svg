<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 752" width="800" height="752" role="img">
  <title>Build one revision for two platforms</title>
  <desc>One source package fans out into Linux and Windows pipelines. Each pipeline compiles, tests, and packages that same revision. Both platform packages are collected as release artifacts.</desc>
