<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 688" width="800" height="688" role="img">
  <title>Record retention</title>
  <desc>An illustrative batch contains 1,000 records. Required-field checks retain 800, schema checks retain 600, and deduplication retains 480. Band widths are proportional to retained counts; adjacent notes explain each reduction.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
