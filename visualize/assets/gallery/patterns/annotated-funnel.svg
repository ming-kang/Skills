    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="800" height="688" fill="#FFFFFF"/>
<polygon data-role="data-mark" points="80.0,168 480.0,168 440.0,232 120.0,232" fill="#E1F5EE" fill-opacity="0.6"/>
<polygon data-role="data-mark" points="120.0,296 440.0,296 400.0,360 160.0,360" fill="#E1F5EE" fill-opacity="0.6"/>
<polygon data-role="data-mark" points="160.0,424 400.0,424 376.0,488 184.0,488" fill="#E1F5EE" fill-opacity="0.6"/>
