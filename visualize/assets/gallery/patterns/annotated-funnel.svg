<path data-role="decoration" d="M376 520 L520 520" fill="none" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect data-role="data-mark" x="80.0" y="104" width="400.0" height="64" rx="6" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect data-role="data-mark" x="120.0" y="232" width="320.0" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect data-role="data-mark" x="160.0" y="360" width="240.0" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect data-role="data-mark" x="184.0" y="488" width="192.0" height="64" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="520" y="104" width="240" height="64" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="520" y="232" width="240" height="64" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="520" y="360" width="240" height="64" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="520" y="488" width="240" height="64" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text data-role="node-text" x="640" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Sample batch</text>
  <text data-role="node-text" x="640" y="145" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">fictional input counts</text>
  <text data-role="node-text" x="640" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">200 removed</text>
  <text data-role="node-text" x="640" y="273" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">required fields absent</text>
  <text data-role="node-text" x="640" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">200 removed</text>
  <text data-role="node-text" x="640" y="401" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">schema mismatch</text>
  <text data-role="node-text" x="640" y="512" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">120 removed</text>
  <text data-role="node-text" x="640" y="529" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">duplicate records</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Record retention</text>
