<text data-role="node-text" x="280" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">1,000 records · 100%</text>
<text data-role="node-text" x="280" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Complete</text>
<text data-role="node-text" x="280" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">800 records · 80%</text>
<text data-role="node-text" x="280" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Valid</text>
<text data-role="node-text" x="280" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">600 records · 60%</text>
<text data-role="node-text" x="280" y="512" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Unique</text>
<text data-role="node-text" x="280" y="532" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">480 records · 48%</text>
<text data-role="caption" x="80" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Each count refers to the retained batch; removals are relative to the prior stage.</text>
