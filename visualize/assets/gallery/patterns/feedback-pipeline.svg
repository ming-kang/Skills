<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 648" width="800" height="648" role="img">
  <title>Review and release</title>
  <desc>Draft, build, review, and release form a vertical spine. Rejected work returns to the draft through a separate revision gutter. A sidebar lists the review criteria.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="800" height="648" fill="#FFFFFF"/>
  <rect data-role="panel" x="512" y="280" width="248" height="184" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="512" y="280" width="248" height="26" rx="8" fill="#FAEEDA"/>
  <rect x="512" y="292" width="248" height="14" fill="#FAEEDA"/>
  <line data-role="connector" x1="272" y1="160" x2="272" y2="216" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="272" y1="272" x2="272" y2="328" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="272" y1="384" x2="272" y2="440" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path data-role="connector" d="M128 356 L56 356 L56 132 L128 132" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path data-role="decoration" d="M416 356 L464 356 L512 356" fill="none" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
  <rect data-role="node" x="128" y="104" width="288" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="128" y="216" width="288" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="128" y="328" width="288" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect data-role="node" x="128" y="440" width="288" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="272" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Draft</text>
  <text data-role="node-text" x="272" y="141" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">describe the change</text>
  <text data-role="node-text" x="272" y="236" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Build</text>
  <text data-role="node-text" x="272" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">prepare the artifact</text>
  <text data-role="node-text" x="272" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Review</text>
  <text data-role="node-text" x="272" y="365" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">check against the criteria</text>
  <text data-role="node-text" x="272" y="460" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Release</text>
  <text data-role="node-text" x="272" y="477" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">publish the accepted artifact</text>
  <text data-role="container-label" x="528" y="293" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Review criteria</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Review and release</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">A clear forward path, a separate revision loop, and a local explanation</text>
  <text data-role="arrow-label" x="284" y="412" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">accepted</text>
  <text data-role="arrow-label" x="68" y="244" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">revise</text>
<text data-role="caption" x="532" y="332" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Correct behavior</text>
<text data-role="caption" x="532" y="364" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Readable output</text>
<text data-role="caption" x="532" y="396" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Complete records</text>
<text data-role="caption" x="532" y="428" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Reproducible checks</text>
<text data-role="caption" x="128" y="552" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Rejected work returns to draft; accepted work moves to release.</text>
<line x1="40" y1="584" x2="760" y2="584" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="602" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="608" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Work</text>
<rect x="109" y="602" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text data-role="legend-label" x="127" y="608" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Review</text>
<rect x="193" y="602" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="211" y="608" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Accepted</text>
<line x1="289" y1="608" x2="319" y2="608" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text data-role="legend-label" x="331" y="608" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Forward</text>
<line x1="403" y1="608" x2="433" y2="608" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text data-role="legend-label" x="445" y="608" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Revise</text>
</svg>
