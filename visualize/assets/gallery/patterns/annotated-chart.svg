<text data-role="caption" x="328" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">3</text>
<text data-role="caption" x="444" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">4</text>
<text data-role="caption" x="560" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">5</text>
<text data-role="caption" x="328" y="420" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Attempt</text>
<text data-role="caption" x="628" y="196" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Attempts 4–5</text>
<text data-role="caption" x="628" y="224" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">same delay</text>
<line x1="40" y1="448" x2="760" y2="448" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<line x1="40" y1="472" x2="70" y2="472" stroke="#1D9E75" stroke-width="1.5"/>
<circle data-role="data-mark" cx="55" cy="472" r="4" fill="#1D9E75"/>
<text data-role="legend-label" x="82" y="472" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Scheduled delay</text>
</svg>
