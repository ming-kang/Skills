<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" width="800" height="512" role="img">
  <title>Retry delay by attempt</title>
  <desc>An illustrative retry schedule uses delays of 1, 2, 4, 8, and 8 seconds across attempts 1 through 5. Linear axes and a local callout identify the eight-second cap.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="800" height="512" fill="#FFFFFF"/>
<line x1="96" y1="368" x2="560" y2="368" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<line x1="96" y1="320" x2="560" y2="320" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<line x1="96" y1="272" x2="560" y2="272" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<line x1="96" y1="224" x2="560" y2="224" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<line x1="96" y1="176" x2="560" y2="176" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<line x1="96" y1="128" x2="560" y2="128" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<path data-role="decoration" d="M96 128 V368 H560" fill="none" stroke="#73726C" stroke-width="0.75"/>
  <rect data-role="panel" x="608" y="144" width="152" height="112" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="608" y="144" width="152" height="26" rx="8" fill="#E1F5EE"/>
  <rect x="608" y="156" width="152" height="14" fill="#E1F5EE"/>
<path data-role="decoration" d="M560 176 L608 176" fill="none" stroke="#73726C" stroke-width="0.75" stroke-dasharray="3 3"/>
<polyline data-role="data-mark" points="96,344 212,320 328,272 444,176 560,176" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle data-role="data-mark" cx="96" cy="344" r="4" fill="#1D9E75"/>
<circle data-role="data-mark" cx="212" cy="320" r="4" fill="#1D9E75"/>
<circle data-role="data-mark" cx="328" cy="272" r="4" fill="#1D9E75"/>
<circle data-role="data-mark" cx="444" cy="176" r="4" fill="#1D9E75"/>
<circle data-role="data-mark" cx="560" cy="176" r="4" fill="#1D9E75"/>
  <text data-role="container-label" x="624" y="157" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">8 s cap</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Retry delay by attempt</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Illustrative schedule · linear axes · seconds</text>
<text data-role="caption" x="96" y="96" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Delay (s)</text>
<text data-role="caption" x="80" y="368" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">0</text>
<text data-role="caption" x="80" y="320" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">2</text>
<text data-role="caption" x="80" y="272" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">4</text>
<text data-role="caption" x="80" y="224" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">6</text>
<text data-role="caption" x="80" y="176" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">8</text>
<text data-role="caption" x="80" y="128" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">10</text>
<text data-role="caption" x="96" y="392" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">1</text>
