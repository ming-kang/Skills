<text data-role="legend-label" x="162" y="576" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Project</text>
<rect x="234" y="570" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="252" y="576" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Small fix</text>
<rect x="337" y="570" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text data-role="legend-label" x="355" y="576" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Review scope</text>
</svg>
