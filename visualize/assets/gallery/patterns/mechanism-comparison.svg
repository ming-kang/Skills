<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img">
  <title>同一组数据，两种求和方式</title>
  <desc>对输入 2、4、3，批量方式保留全部值后求和；逐项方式将累计值从 0 更新为 2、6、9。两种方式的最终总和都为 9。</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="800" height="640" fill="#FFFFFF"/>
  <rect data-role="panel" x="40" y="104" width="336" height="336" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="40" y="104" width="336" height="26" rx="8" fill="#E1F5EE"/>
  <rect x="40" y="116" width="336" height="14" fill="#E1F5EE"/>
  <rect data-role="panel" x="424" y="104" width="336" height="336" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="424" y="104" width="336" height="26" rx="8" fill="#EEEDFE"/>
  <rect x="424" y="116" width="336" height="14" fill="#EEEDFE"/>
<line x1="40" y1="464" x2="760" y2="464" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line data-role="connector" x1="112" y1="194" x2="112" y2="240" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="208" y1="194" x2="208" y2="240" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="304" y1="194" x2="304" y2="240" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="208" y1="296" x2="208" y2="352" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="496" y1="194" x2="496" y2="240" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="592" y1="194" x2="592" y2="240" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="688" y1="194" x2="688" y2="240" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="536" y1="268" x2="552" y2="268" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="632" y1="268" x2="648" y2="268" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path data-role="connector" d="M688 296 L688 328 L592 328 L592 352" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle data-role="data-mark" cx="112" cy="176" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<circle data-role="data-mark" cx="208" cy="176" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<circle data-role="data-mark" cx="304" cy="176" r="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<circle data-role="data-mark" cx="496" cy="176" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<circle data-role="data-mark" cx="592" cy="176" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<circle data-role="data-mark" cx="688" cy="176" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect data-role="node" x="80" y="240" width="256" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="104" y="352" width="208" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="456" y="240" width="80" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect data-role="node" x="552" y="240" width="80" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect data-role="node" x="648" y="240" width="80" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect data-role="node" x="488" y="352" width="208" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text data-role="container-label" x="56" y="117" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">批量求和</text>
  <text data-role="container-label" x="440" y="117" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">逐项累加</text>
  <text data-role="node-text" x="208" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">保留全部输入</text>
  <text data-role="node-text" x="208" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">2 · 4 · 3</text>
  <text data-role="node-text" x="208" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">总和 = 9</text>
  <text data-role="node-text" x="208" y="389" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">收到所有值后计算</text>
  <text data-role="node-text" x="496" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">2</text>
  <text data-role="node-text" x="496" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">0 + 2</text>
  <text data-role="node-text" x="592" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">6</text>
  <text data-role="node-text" x="592" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">2 + 4</text>
  <text data-role="node-text" x="688" y="260" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">9</text>
  <text data-role="node-text" x="688" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">6 + 3</text>
  <text data-role="node-text" x="592" y="372" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">总和 = 9</text>
  <text data-role="node-text" x="592" y="389" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">每次只更新当前总和</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">同一组数据，两种求和方式</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">输入为 2、4、3；并列展示处理机制和保留的数据</text>
<text data-role="node-text" x="112" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">2</text>
<text data-role="node-text" x="208" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">4</text>
<text data-role="node-text" x="304" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">3</text>
<text data-role="node-text" x="496" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">2</text>
<text data-role="node-text" x="592" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">4</text>
<text data-role="node-text" x="688" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">3</text>
<text data-role="caption" x="40" y="492" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">处理时保留</text>
<text data-role="caption" x="208" y="492" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">全部输入值</text>
<text data-role="caption" x="592" y="492" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">当前累计值</text>
<text data-role="caption" x="40" y="532" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">更新时机</text>
<text data-role="caption" x="208" y="532" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">收齐后计算</text>
<text data-role="caption" x="592" y="532" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">每收到一个值</text>
<line x1="40" y1="576" x2="760" y2="576" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="594" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">批量方式</text>
<rect x="133" y="594" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text data-role="legend-label" x="151" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">逐项方式</text>
</svg>
