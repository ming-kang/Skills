<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img">
  <title>Flowchart skeleton</title>
  <desc>Minimal decision flow: start, process, decision with two exits.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#FFFFFF"/>
  <line x1="340" y1="80" x2="340" y2="156" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="340" y1="212" x2="330" y2="272" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M280 312 L160 312 L160 370" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M380 312 L500 312 L500 370" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="280" y="40" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="280" y="156" width="120" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <polygon points="330,272 380,312 330,352 280,312" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="100" y="370" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="440" y="370" width="120" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text data-role="node-text" x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Start</text>
  <text data-role="node-text" x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Process</text>
  <text data-role="node-text" x="340" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">do work</text>
  <text data-role="node-text" x="330" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">OK?</text>
  <text data-role="node-text" x="160" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Done</text>
  <text data-role="node-text" x="500" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Retry</text>
  <text data-role="arrow-label" x="220" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">yes</text>
  <text data-role="arrow-label" x="440" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">no</text>
</svg>
