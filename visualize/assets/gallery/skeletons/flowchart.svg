<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img">
  <title>Decision scaffold</title>
  <desc>Start, process, and check a condition. A successful result ends the flow; retry returns to processing.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="560" height="560" fill="#FFFFFF"/>
  <line x1="264" y1="128" x2="264" y2="184" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="264" y1="240" x2="264" y2="296" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M192 336 L144 336 L144 432" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M336 336 L416 336 L416 432" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M496 452 L520 452 L520 212 L344 212" fill="none" stroke="#C75B38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="184" y="88" width="160" height="40" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="184" y="184" width="160" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <polygon points="264,296 336,336 264,376 192,336" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <rect x="64" y="432" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="336" y="432" width="160" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text data-role="node-text" x="264" y="108" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Start</text>
  <text data-role="node-text" x="264" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Process</text>
  <text data-role="node-text" x="264" y="221" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">do work</text>
  <text data-role="node-text" x="264" y="336" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Valid?</text>
  <text data-role="node-text" x="144" y="452" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Done</text>
  <text data-role="node-text" x="416" y="452" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Retry</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Decision scaffold</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">A decision with a complete retry path</text>
  <text data-role="arrow-label" x="156" y="384" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">yes</text>
  <text data-role="arrow-label" x="428" y="384" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">no</text>
  <text data-role="arrow-label" x="508" y="332" text-anchor="end" dominant-baseline="central" font-size="12" fill="#3D3D3A">repeat</text>
<line x1="40" y1="496" x2="520" y2="496" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="514" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="520" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Decision</text>
<rect x="137" y="514" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="155" y="520" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Passed</text>
<rect x="220" y="514" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text data-role="legend-label" x="238" y="520" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Retry</text>
</svg>
