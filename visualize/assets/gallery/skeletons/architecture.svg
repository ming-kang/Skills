<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img">
  <title>Layered architecture</title>
  <desc>A minimal client, service, and database stack with aligned centers.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="360" height="480" fill="#FFFFFF"/>
  <line x1="180" y1="152" x2="180" y2="208" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="180" y1="264" x2="180" y2="320" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="80" y="96" width="200" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="80" y="208" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <path d="M 80 329 A 100 9 0 0 1 280 329 L 280 383 A 100 9 0 0 1 80 383 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="180" cy="329" rx="100" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="180" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text data-role="node-text" x="180" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">browser / mobile</text>
  <text data-role="node-text" x="180" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Service</text>
  <text data-role="node-text" x="180" y="245" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">business logic</text>
  <text data-role="node-text" x="180" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Database</text>
  <text data-role="node-text" x="180" y="365" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">persistent store</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Layered architecture</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Replace each layer with your component</text>
  <text data-role="arrow-label" x="192" y="180" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">request</text>
  <text data-role="arrow-label" x="192" y="292" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">query</text>
<line x1="40" y1="416" x2="320" y2="416" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="434" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="440" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Client</text>
<rect x="123" y="434" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="141" y="440" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Backend</text>
</svg>
