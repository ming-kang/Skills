<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img">
  <title>Architecture skeleton</title>
  <desc>Minimal layered architecture: client, service, database.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#FFFFFF"/>
  <line x1="112" y1="96" x2="104" y2="156" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="104" y1="212" x2="112" y2="272" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="40" y="40" width="144" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="40" y="156" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <path d="M 40 281 A 72 9 0 0 1 184 281 L 184 335 A 72 9 0 0 1 40 335 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="112" cy="281" rx="72" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="112" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text data-role="node-text" x="112" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">browser / mobile</text>
  <text data-role="node-text" x="104" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Service</text>
  <text data-role="node-text" x="104" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">business logic</text>
  <text data-role="node-text" x="112" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Database</text>
  <text data-role="node-text" x="112" y="317" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">persistent store</text>
  <text data-role="arrow-label" x="116" y="126" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">request</text>
  <text data-role="arrow-label" x="116" y="242" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">query</text>
</svg>
