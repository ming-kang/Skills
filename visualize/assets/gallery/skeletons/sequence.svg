<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img">
  <title>Sequence skeleton</title>
  <desc>Minimal sequence: two actors, request and response.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="600" height="260" fill="#FFFFFF"/>
  <line x1="180" y1="120" x2="180" y2="220" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="480" y1="120" x2="480" y2="220" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <line x1="180" y1="120" x2="480" y2="120" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="180" y2="170" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="120" y="80" width="120" height="40" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="420" y="80" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Client</text>
  <text data-role="node-text" x="480" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Server</text>
  <text data-role="arrow-label" x="330" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">request</text>
  <text data-role="arrow-label" x="330" y="162" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">response</text>
</svg>
