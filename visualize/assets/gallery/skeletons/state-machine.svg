<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img">
  <title>State machine skeleton</title>
  <desc>Minimal state machine: initial, one state, final.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="600" height="200" fill="#FFFFFF"/>
  <line x1="60" y1="100" x2="180" y2="108" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="300" y1="108" x2="480" y2="100" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="60" cy="100" r="8" fill="#141413"/>
  <rect x="180" y="80" width="120" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <circle cx="480" cy="100" r="12" fill="none" stroke="#141413" stroke-width="1.5"/>
  <circle cx="480" cy="100" r="8" fill="#141413"/>
  <text data-role="node-text" x="240" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Active</text>
  <text data-role="node-text" x="240" y="117" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">processing</text>
  <text data-role="arrow-label" x="390" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">done</text>
</svg>
