<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 208" width="520" height="208" role="img">
  <title>State lifecycle</title>
  <desc>An initial state starts processing; a finish event reaches the final state. Arrows stop at the circle boundaries.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="520" height="208" fill="#FFFFFF"/>
  <line data-role="connector" x1="72" y1="132" x2="180" y2="132" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="340" y1="132" x2="444" y2="132" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="64" cy="132" r="8" fill="#141413"/>
  <rect data-role="node" x="180" y="104" width="160" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <circle cx="456" cy="132" r="12" fill="none" stroke="#141413" stroke-width="1.5"/>
  <circle cx="456" cy="132" r="8" fill="#141413"/>
  <text data-role="node-text" x="260" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Active</text>
  <text data-role="node-text" x="260" y="141" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">processing</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">State lifecycle</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">One state between initial and final markers</text>
  <text data-role="arrow-label" x="126" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">start</text>
  <text data-role="arrow-label" x="392" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">finish</text>
</svg>
