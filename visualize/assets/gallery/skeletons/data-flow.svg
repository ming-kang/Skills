<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img">
  <title>Data flow skeleton</title>
  <desc>Minimal three-stage pipeline: ingest, transform, store.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="200" fill="#FFFFFF"/>
  <line x1="160" y1="108" x2="216" y2="108" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="344" y1="108" x2="400" y2="108" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="40" y="80" width="120" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="216" y="80" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="400" y="80" width="124" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text data-role="node-text" x="100" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Ingest</text>
  <text data-role="node-text" x="100" y="117" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">raw events</text>
  <text data-role="node-text" x="280" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Transform</text>
  <text data-role="node-text" x="280" y="117" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">clean &amp; enrich</text>
  <text data-role="node-text" x="462" y="100" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Store</text>
  <text data-role="node-text" x="462" y="117" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">write to sink</text>
  <text data-role="arrow-label" x="188" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">stream</text>
  <text data-role="arrow-label" x="372" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">batch</text>
  <rect x="40" y="174" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="legend-label" x="58" y="180" dominant-baseline="central" font-size="12" fill="#3D3D3A">processing</text>
  <rect x="151" y="174" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text data-role="legend-label" x="169" y="180" dominant-baseline="central" font-size="12" fill="#3D3D3A">storage</text>
</svg>
