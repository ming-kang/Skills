<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" role="img">
  <title>Data flow scaffold</title>
  <desc>Ingest raw events, transform them, and store the resulting batch.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="256" fill="#FFFFFF"/>
  <line x1="184" y1="140" x2="248" y2="140" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="392" y1="140" x2="456" y2="140" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="40" y="112" width="144" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="248" y="112" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="456" y="112" width="144" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="112" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Ingest</text>
  <text data-role="node-text" x="112" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">raw events</text>
  <text data-role="node-text" x="320" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Transform</text>
  <text data-role="node-text" x="320" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">clean &amp; enrich</text>
  <text data-role="node-text" x="528" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Store</text>
  <text data-role="node-text" x="528" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">write to sink</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Data flow scaffold</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Name each stage and label the payload between stages</text>
  <text data-role="arrow-label" x="216" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">stream</text>
  <text data-role="arrow-label" x="424" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">batch</text>
<line x1="40" y1="192" x2="600" y2="192" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="210" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="216" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Ingest</text>
<rect x="123" y="210" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="141" y="216" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Process / store</text>
</svg>
