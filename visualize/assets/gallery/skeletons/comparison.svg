<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img">
  <title>Comparison skeleton</title>
  <desc>Minimal 2x2 feature matrix.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="520" height="240" fill="#FFFFFF"/>
<rect x="196" y="80" width="128" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="346" y="80" width="128" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<rect x="196" y="140" width="128" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<rect x="346" y="140" width="128" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="node-text" x="260" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Option A</text>
<text data-role="node-text" x="410" y="54" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Option B</text>
<text data-role="node-text" x="100" y="104" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Feature 1</text>
<text data-role="node-text" x="100" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Feature 2</text>
<text data-role="node-text" x="260" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Good</text>
<text data-role="node-text" x="410" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Poor</text>
<text data-role="node-text" x="260" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Poor</text>
<text data-role="node-text" x="410" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Good</text>
  <rect x="40" y="214" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="legend-label" x="58" y="220" dominant-baseline="central" font-size="12" fill="#3D3D3A">strong</text>
  <rect x="123" y="214" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text data-role="legend-label" x="141" y="220" dominant-baseline="central" font-size="12" fill="#3D3D3A">weak</text>
</svg>
