<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664" width="720" height="664" role="img">
  <title>Network topology</title>
  <desc>HTTPS traffic crosses the firewall into a DMZ subnet and is routed to two application hosts.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="720" height="664" fill="#FFFFFF"/>
  <rect data-role="container" x="40" y="304" width="640" height="264" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text data-role="container-label" x="60" y="330" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">DMZ</text>
  <text data-role="container-label" x="60" y="348" dominant-baseline="central" font-size="12" fill="#3D3D3A">10.0.1.0/24</text>
  <line data-role="connector" x1="360" y1="152" x2="360" y2="208" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="360" y1="264" x2="360" y2="364" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path data-role="connector" d="M360 420 L360 450" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path data-role="connector" d="M198 450 L522 450" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-role="connector" x1="198" y1="450" x2="198" y2="476" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="522" y1="450" x2="522" y2="476" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect data-role="node" x="270" y="96" width="180" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="270" y="208" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <rect data-role="node" x="270" y="364" width="180" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="108" y="476" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="432" y="476" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="360" y="116" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Internet</text>
  <text data-role="node-text" x="360" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">public WAN</text>
  <text data-role="node-text" x="360" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Firewall</text>
  <text data-role="node-text" x="360" y="245" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">ingress filter</text>
  <text data-role="node-text" x="360" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Core switch</text>
  <text data-role="node-text" x="360" y="401" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">L3 routing</text>
  <text data-role="node-text" x="198" y="496" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">App server A</text>
  <text data-role="node-text" x="198" y="513" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">10.0.1.10</text>
  <text data-role="node-text" x="522" y="496" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">App server B</text>
  <text data-role="node-text" x="522" y="513" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">10.0.1.11</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Network topology</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">A filtered ingress path into the application subnet</text>
  <text data-role="arrow-label" x="372" y="180" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">HTTPS</text>
  <text data-role="arrow-label" x="372" y="314" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">filtered</text>
<line x1="40" y1="600" x2="680" y2="600" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="618" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="624" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Network</text>
<rect x="130" y="618" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text data-role="legend-label" x="148" y="624" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Security boundary</text>
<rect x="289" y="618" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="307" y="624" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Application hosts</text>
</svg>
