<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img">
  <title>Streaming data pipeline</title>
  <desc>Kafka streams events to Spark, which writes Parquet to S3 for Athena queries.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="272" fill="#FFFFFF"/>
  <line x1="168" y1="148" x2="224" y2="148" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="352" y1="148" x2="408" y2="148" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="536" y1="148" x2="592" y2="148" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="40" y="120" width="128" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="224" y="120" width="128" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <path d="M 408 121 A 64 9 0 0 1 536 121 L 536 175 A 64 9 0 0 1 408 175 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse cx="472" cy="121" rx="64" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="592" y="120" width="128" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text data-role="node-text" x="104" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Kafka</text>
  <text data-role="node-text" x="104" y="157" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">event stream</text>
  <text data-role="node-text" x="288" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Spark</text>
  <text data-role="node-text" x="288" y="157" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">transform</text>
  <text data-role="node-text" x="472" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">S3</text>
  <text data-role="node-text" x="472" y="157" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Parquet</text>
  <text data-role="node-text" x="656" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Athena</text>
  <text data-role="node-text" x="656" y="157" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">SQL query</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Streaming data pipeline</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Ingest events, transform batches, then query the stored data</text>
  <text data-role="arrow-label" x="196" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">stream</text>
  <text data-role="arrow-label" x="380" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">batch</text>
  <text data-role="arrow-label" x="564" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">query</text>
<line x1="40" y1="208" x2="720" y2="208" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="226" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="232" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Ingest</text>
<rect x="123" y="226" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="141" y="232" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Write path</text>
<rect x="234" y="226" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text data-role="legend-label" x="252" y="232" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Read path</text>
</svg>
