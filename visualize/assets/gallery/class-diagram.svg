<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 636" width="680" height="636" role="img">
  <title>Class hierarchy</title>
  <desc>Animal implements Comparable. Dog and Cat extend the abstract Animal class. Compartments show names, attributes, and methods.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="636" fill="#FFFFFF"/>
  <line x1="340" y1="264" x2="340" y2="196" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M176 464 L176 424 L504 424 L504 464" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="340" y1="424" x2="340" y2="382" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="236" y="96" width="208" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <line x1="236" y1="144" x2="444" y2="144" stroke="#0F6E56" stroke-width="0.5"/>
  <line x1="236" y1="170" x2="444" y2="170" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="236" y="264" width="208" height="118" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="236" y1="294" x2="444" y2="294" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="236" y1="338" x2="444" y2="338" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="72" y="464" width="208" height="82" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="72" y1="494" x2="280" y2="494" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="72" y1="520" x2="280" y2="520" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="400" y="464" width="208" height="82" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="400" y1="494" x2="608" y2="494" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <line x1="400" y1="520" x2="608" y2="520" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <text data-role="node-text" x="340" y="109" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">&lt;&lt;interface&gt;&gt;</text>
  <text data-role="node-text" x="340" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Comparable</text>
  <text data-role="node-text" x="248" y="184" dominant-baseline="central" font-size="12" fill="#0F6E56">+compareTo(o): int</text>
  <text data-role="node-text" x="340" y="279" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" font-style="italic" fill="#141413">Animal</text>
  <text data-role="node-text" x="248" y="308" dominant-baseline="central" font-size="12" fill="#3D3D3A">-name: String</text>
  <text data-role="node-text" x="248" y="326" dominant-baseline="central" font-size="12" fill="#3D3D3A">#age: int</text>
  <text data-role="node-text" x="248" y="352" dominant-baseline="central" font-size="12" fill="#3D3D3A">+eat(): void</text>
  <text data-role="node-text" x="248" y="370" dominant-baseline="central" font-size="12" fill="#3D3D3A">+sleep(): void</text>
  <text data-role="node-text" x="176" y="479" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Dog</text>
  <text data-role="node-text" x="84" y="508" dominant-baseline="central" font-size="12" fill="#3D3D3A">-trick: String</text>
  <text data-role="node-text" x="84" y="534" dominant-baseline="central" font-size="12" fill="#3D3D3A">+bark(): void</text>
  <text data-role="node-text" x="504" y="479" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Cat</text>
  <text data-role="node-text" x="412" y="508" dominant-baseline="central" font-size="12" fill="#3D3D3A">-indoor: bool</text>
  <text data-role="node-text" x="412" y="534" dominant-baseline="central" font-size="12" fill="#3D3D3A">+meow(): void</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Class hierarchy</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">An interface, an abstract base class, and two concrete classes</text>
  <text data-role="arrow-label" x="352" y="230" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">«implements»</text>
<text data-role="arrow-label" x="352" y="403" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">extends</text>
<line x1="40" y1="572" x2="640" y2="572" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="590" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="596" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Interface</text>
<rect x="144" y="590" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="162" y="596" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Class</text>
<line x1="220" y1="596" x2="250" y2="596" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text data-role="legend-label" x="262" y="596" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Inheritance</text>
<line x1="361" y1="596" x2="391" y2="596" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text data-role="legend-label" x="403" y="596" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Implementation</text>
</svg>
