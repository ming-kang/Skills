<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488" role="img">
  <title>Agent 工具调用循环</title>
  <desc>用户提问后，LLM 决定输出答案或调用工具；工具结果返回 LLM，形成反馈循环。</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="488" fill="#FFFFFF"/>
  <line x1="380" y1="160" x2="380" y2="216" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="272" x2="380" y2="328" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="280" y1="244" x2="208" y2="244" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="480" y1="356" x2="568" y2="356" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M644 328 L644 244 L480 244" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="280" y="104" width="200" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="280" y="216" width="200" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="280" y="328" width="200" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect x="40" y="216" width="168" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="568" y="328" width="152" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text data-role="node-text" x="380" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">用户提问</text>
  <text data-role="node-text" x="380" y="141" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">自然语言</text>
  <text data-role="node-text" x="380" y="236" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">LLM</text>
  <text data-role="node-text" x="380" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">推理并决定</text>
  <text data-role="node-text" x="380" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">工具调用</text>
  <text data-role="node-text" x="380" y="365" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">选择并发起</text>
  <text data-role="node-text" x="124" y="236" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">最终答案</text>
  <text data-role="node-text" x="124" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">信息充分时输出</text>
  <text data-role="node-text" x="644" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">工具</text>
  <text data-role="node-text" x="644" y="365" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">搜索 · 代码 · 计算</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">Agent 工具调用循环</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">依据工具结果继续推理，信息充分时输出答案</text>
  <text data-role="arrow-label" x="392" y="300" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">调用</text>
  <text data-role="arrow-label" x="244" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">完成</text>
  <text data-role="arrow-label" x="524" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">执行</text>
  <text data-role="arrow-label" x="562" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">反馈</text>
<line x1="40" y1="424" x2="720" y2="424" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="442" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="448" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">推理</text>
<rect x="108" y="442" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="126" y="448" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">完成</text>
<rect x="175" y="442" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text data-role="legend-label" x="193" y="448" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">工具</text>
<rect x="243" y="442" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text data-role="legend-label" x="261" y="448" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">反馈</text>
</svg>
