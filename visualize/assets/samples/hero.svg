<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 704" width="760" height="704" role="img">
  <title>RAG pipeline</title>
  <desc>A query is embedded, retrieves top-k chunks from an offline-indexed vector store, and reaches an LLM that returns a grounded answer.</desc>
  <style>text { font-family: 'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; }</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect data-role="background" width="760" height="704" fill="#FFFFFF"/>
  <rect data-role="container" x="452" y="104" width="268" height="320" rx="14" fill="none" stroke="rgba(31,30,29,0.3)" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text data-role="container-label" x="472" y="130" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Knowledge base</text>
  <text data-role="container-label" x="472" y="148" dominant-baseline="central" font-size="12" fill="#3D3D3A">offline indexing</text>
  <line data-role="connector" x1="192" y1="168" x2="192" y2="224" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="192" y1="280" x2="192" y2="336" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="192" y1="392" x2="192" y2="448" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="192" y1="504" x2="192" y2="560" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="586" y1="224" x2="586" y2="328" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line data-role="connector" x1="496" y1="364" x2="304" y2="364" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect data-role="node" x="80" y="112" width="224" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="80" y="224" width="224" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="80" y="336" width="224" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="80" y="448" width="224" height="56" rx="8" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
  <rect data-role="node" x="80" y="560" width="224" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <rect data-role="node" x="496" y="168" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <path data-role="node" d="M 496 337 A 90 9 0 0 1 676 337 L 676 391 A 90 9 0 0 1 496 391 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <ellipse data-role="node-part" cx="586" cy="337" rx="90" ry="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text data-role="node-text" x="192" y="132" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">User query</text>
  <text data-role="node-text" x="192" y="149" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">natural language</text>
  <text data-role="node-text" x="192" y="244" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Embed</text>
  <text data-role="node-text" x="192" y="261" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">query → vector</text>
  <text data-role="node-text" x="192" y="356" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Retrieve</text>
  <text data-role="node-text" x="192" y="373" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">top-k similar chunks</text>
  <text data-role="node-text" x="192" y="468" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">LLM</text>
  <text data-role="node-text" x="192" y="485" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">answer from context</text>
  <text data-role="node-text" x="192" y="580" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Response</text>
  <text data-role="node-text" x="192" y="597" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">grounded answer</text>
  <text data-role="node-text" x="586" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Documents</text>
  <text data-role="node-text" x="586" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">corpus</text>
  <text data-role="node-text" x="586" y="356" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Vector store</text>
  <text data-role="node-text" x="586" y="373" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">embeddings</text>
<text data-role="diagram-title" x="40" y="32" text-anchor="start" dominant-baseline="central" font-size="16" font-weight="600" fill="#141413">RAG pipeline</text>
<text data-role="caption" x="40" y="56" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Online retrieval backed by an offline document index</text>
<text data-role="caption" x="80" y="88" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">Query time</text>
  <text data-role="arrow-label" x="204" y="308" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">vector</text>
  <text data-role="arrow-label" x="204" y="420" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">context</text>
  <text data-role="arrow-label" x="204" y="532" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">answer</text>
  <text data-role="arrow-label" x="598" y="276" text-anchor="start" dominant-baseline="central" font-size="12" fill="#3D3D3A">index</text>
  <text data-role="arrow-label" x="400" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">top-k</text>
<line x1="40" y1="640" x2="720" y2="640" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<rect x="40" y="658" width="12" height="12" rx="3" fill="#F5F4ED" stroke="rgba(31,30,29,0.3)" stroke-width="0.5"/>
<text data-role="legend-label" x="58" y="664" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Query / generation</text>
<rect x="205" y="658" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text data-role="legend-label" x="223" y="664" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Retrieval / answer</text>
<rect x="371" y="658" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text data-role="legend-label" x="389" y="664" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3D3D3A">Indexing</text>
</svg>
