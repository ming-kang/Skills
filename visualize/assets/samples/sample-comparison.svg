  <text data-role="node-text" x="124" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">RAG</text>
  <text data-role="node-text" x="124" y="173" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">检索增强生成</text>
  <text data-role="node-text" x="392" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">检索外部知识</text>
  <text data-role="node-text" x="392" y="173" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">查询时拼接</text>
  <text data-role="node-text" x="672" y="156" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">知识可更新</text>
