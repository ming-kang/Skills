  <text data-role="node-text" x="124" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">提示工程</text>
  <text data-role="node-text" x="124" y="341" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">Prompting</text>
  <text data-role="node-text" x="392" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#141413">加入指令与示例</text>
  <text data-role="node-text" x="392" y="341" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3D3D3A">直接组织上下文</text>
  <text data-role="node-text" x="672" y="324" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">受上下文长度限制</text>
